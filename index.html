const state = { date: dates[0], off: new Set(), q: '', sort: 'az' };

const dateObj = d => new Date(d + 'T12:00:00');
const fmt = (d, o) => dateObj(d).toLocaleDateString('en-US', o);

function header() {
  const gen = new Date(DATA.generated);
  $('lede').textContent = `Showtimes for ${DATA.zones.join(', ')}, plus the Cineteca and independent cinemas. Updated ` +
    gen.toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Mexico_City' }) + ' (Mexico City time).';
  $('sources').innerHTML = DATA.sources.map(s =>
    `<li class="${esc(s.state)}"><span class="dot"></span><b>${esc(s.name)}</b><span class="note">${esc(s.note)}</span>` +
    (s.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(' · ') +
    '</li>').join('');
  // One-line summary; the full list folds open (open from the start on wide screens).
  const label = { ok: 'updated', partial: 'partly updated', error: 'not read', pending: 'no listings' };
  const n = st => DATA.sources.filter(s => s.state === st).length;
  $('srcsum').innerHTML = '<b>Sources</b>' + ['ok', 'partial', 'error', 'pending'].filter(n)
    .map(st => `<span class="${st}"><span class="dot"></span>${n(st)} ${label[st]}</span>`).join('');
  if (matchMedia('(min-width: 641px)').matches) $('srcs').open = true;
  $('foot').textContent = 'Times come straight from each cinema’s own site and can change; check the cinema before you go. ' +
    'Cinemas usually publish a full week on Thursday, so later days fill in after that.';
}

function showsOn(f, date) {
  const by = f.shows[date] || {};
  return Object.entries(by).filter(([v]) => !state.off.has(v)).sort((a, b) => venueIx[a[0]] - venueIx[b[0]]);
}

// A showtime links to where tickets are sold: that screening's own page when
// the cinema has one, else the film's ticket page. Past times are not links.
function timeChip(f, v, t) {
  if (state.date === TODAY && t < NOW) return `<span class="t past">${esc(t)}</span>`;
  const url = ((((f.buy || {})[state.date] || {})[v]) || {})[t] || f.buy_url;
  return url ? `<a class="t" href="${esc(url)}" target="_blank" rel="noopener" title="Buy tickets">${esc(t)}</a>`
    : `<span class="t">${esc(t)}</span>`;
}

function render() {
  $('days').innerHTML = dates.map(d => {
    const n = DATA.films.filter(f => f.shows[d]).length;
    return `<button class="day" type="button" data-d="${d}" aria-pressed="${d === state.date}">
      <small>${d === TODAY ? 'Today' : fmt(d, { weekday: 'short' })}</small><strong>${dateObj(d).getDate()}</strong><em>${n} films</em></button>`;
  }).join('');
  $('venues').innerHTML = DATA.venues.map((v, i) =>
    `<button class="chip" type="button" data-v="${esc(v.id)}" style="--vc:var(--v${i % 6})" aria-pressed="${!state.off.has(v.id)}"><i></i>${esc(v.name)}</button>`).join('');
  const on = DATA.venues.length - state.off.size;
  $('vcount').textContent = state.off.size ? `${on} of ${DATA.venues.length}` : 'All';

  const q = state.q.trim().toLowerCase();
  let rows = DATA.films.map(f => ({ f, shows: showsOn(f, state.date) }))
    .filter(r => r.shows.length && (!q || r.f.title.toLowerCase().includes(q)));
  const first = r => {
    const ts = r.shows.flatMap(s => s[1]);
    const up = state.date === TODAY ? ts.filter(t => t >= NOW) : ts;
    return (up.length ? up : ['99:99']).sort()[0];
  };
  if (state.sort === 'time') rows.sort((a, b) => first(a).localeCompare(first(b)) || a.f.title.localeCompare(b.f.title));

  const nTimes = rows.reduce((n, r) => n + r.shows.reduce((m, s) => m + s[1].length, 0), 0);
  $('count').textContent = rows.length
    ? `${fmt(state.date, { weekday: 'long', month: 'long', day: 'numeric' })}: ${rows.length} films, ${nTimes} showtimes` : '';
  $('films').innerHTML = rows.length ? rows.map(({ f, shows }) => `
    <article class="film">
      <div>
        <h2>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>` : esc(f.title)}</h2>
        <div class="meta">${f.new ? '<span class="new">New</span>' : ''}${f.rating ? `<span class="rating">${esc(f.rating)}</span>` : ''}${f.section ? `<span>${esc(f.section)}</span>` : ''}</div>
      </div>
      <div class="venues">${shows.map(([v, ts]) => `
        <div class="venue"><span class="vname" style="--vc:var(--v${venueIx[v] % 6})"><i></i>${esc(DATA.venues[venueIx[v]].name)}</span>
        <span class="times">${ts.map(t => timeChip(f, v, t)).join('')}</span></div>`).join('')}
      </div>
    </article>`).join('')
    : '<p class="empty">Nothing matches for this day. Try another day, clear the search, or turn a cinema back on.</p>';
  $('sort-az').setAttribute('aria-pressed', state.sort === 'az');
  $('sort-time').setAttribute('aria-pressed', state.sort === 'time');
}

$('days').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) { state.date = b.dataset.d; render(); } });
$('venues').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return;
  state.off.has(b.dataset.v) ? state.off.delete(b.dataset.v) : state.off.add(b.dataset.v); render(); });
$('vtoggle').addEventListener('click', () => {
  const open = $('vtoggle').getAttribute('aria-expanded') !== 'true';
  $('vtoggle').setAttribute('aria-expanded', open);
  document.querySelector('.bar').classList.toggle('open', open);
});
document.querySelector('.vall').addEventListener('click', e => { const b = e.target.closest('[data-all]'); if (!b) return;
  state.off = b.dataset.all === '1' ? new Set() : new Set(DATA.venues.map(v => v.id)); render(); });
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sort-az').addEventListener('click', () => { state.sort = 'az'; render(); });
$('sort-time').addEventListener('click', () => { state.sort = 'time'; render(); });

header();
if (dates.length) render();
else $('films').innerHTML = '<p class="empty">No showtimes were collected on this run.</p>';
</script>

</body></html>
