/* Layout: a marquee-style masthead, then a sticky strip of day tabs, then one
   row per film with its showtimes grouped by cinema, like a printed listing. */
:root {
  --bg: #f5f4f8;

  --line: #dcd9e6;

  --accent-ink: #ffffff;
  --accent-soft: #ebe3f6;
  --ok: #1f7a4d;
  --warn: #9a5b00;
  --bad: #b3261e;
  --v0: #5a2d8c; --v1: #1f7a4d; --v2: #b0457a; --v3: #1d6fa5; --v4: #9a5b00; --v5: #55606e;

  /* Titles: Libre Franklin, an open-source revival of Franklin Gothic. */
  --title: "Libre Franklin", "Franklin Gothic Demi", "Franklin Gothic Medium", "Franklin Gothic", "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15131d; --surface: #1e1b29; --ink: #eeebf6; --muted: #a59fba; --line: #332f44;
    --accent: #c3a1ee; --accent-ink: #1d1230; --accent-soft: #2e2542;
    --ok: #6ccb98; --warn: #e3ae52; --bad: #f08a80;
    --v0: #c3a1ee; --v1: #6ccb98; --v2: #f097c0; --v3: #7fc0ee; --v4: #e3ae52; --v5: #aab3c0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15131d; --surface: #1e1b29; --ink: #eeebf6; --muted: #a59fba; --line: #332f44;
  --accent: #c3a1ee; --accent-ink: #1d1230; --accent-soft: #2e2542;
  --ok: #6ccb98; --warn: #e3ae52; --bad: #f08a80;
  --v0: #c3a1ee; --v1: #6ccb98; --v2: #f097c0; --v3: #7fc0ee; --v4: #e3ae52; --v5: #aab3c0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mast { display: flex; flex-direction: column; gap: 14px; }
.mast h1 { margin: 0; font-family: var(--title); font-weight: 700; text-transform: uppercase;
  font-size: clamp(2.3rem, 8.5vw, 4rem); line-height: .95; letter-spacing: -.015em; text-wrap: balance; }
.mast h1 span { color: var(--accent); }
.mast p { margin: 0; color: var(--muted); max-width: 62ch; }
.sources { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 0; margin: 0; list-style: none; font-size: 13px; }
.sources li { display: block; }
.sources li > .dot { display: inline-block; vertical-align: 1px; margin-right: 6px; }
.sources b { font-weight: 600; margin-right: 6px; }
.sources span.note { margin-right: 6px; }
@media (max-width: 640px) { .sources { flex-direction: column; gap: 8px; } .sources li { padding-left: 14px; text-indent: -14px; } }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; background: var(--muted); }
.ok .dot { background: var(--ok); } .error .dot { background: var(--bad); } .pending .dot { background: transparent; border: 1.5px solid var(--warn); } .partial .dot { background: var(--warn); }
.sources span.note { color: var(--muted); }
.sources a { color: var(--accent); text-underline-offset: 2px; }
.srcs summary { cursor: pointer; list-style: none; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; }
.srcs summary::-webkit-details-marker { display: none; }
.srcs summary > b { font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.srcs summary > b::after { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg) translateY(-2px); transition: transform .15s; }
.srcs[open] summary > b::after { transform: rotate(-135deg) translate(-2px, 0); }
.srcs summary > span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.srcs .sources { margin-top: 10px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-top: 22px;
  padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px 7px;
  cursor: pointer; text-align: center; min-width: 58px; }
.day small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day strong { display: block; font-family: var(--display); font-weight: 800; letter-spacing: -.02em; font-size: 20px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.day em { display: block; font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 9px; cursor: pointer;

.chip[aria-pressed="false"] { color: var(--muted); border-style: dashed; }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--vc); }
#q { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; }
.sort { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 13px; }
.sort button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; }
.sort button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.count { margin: 16px 0 4px; color: var(--muted); font-size: 13px; }
.films { display: flex; flex-direction: column; }
.film { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 6px 24px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.film h2 { margin: 0; font-family: var(--title); font-weight: 700; text-transform: uppercase; font-size: 1.25rem;
  line-height: 1.15; letter-spacing: 0; text-wrap: balance; overflow-wrap: anywhere; }
.film h2 a { color: inherit; text-decoration: none; }
.film h2 a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 7px; font-size: 12.5px; color: var(--muted); }
.rating { border: 1px solid var(--muted); border-radius: 3px; padding: 0 5px; font-weight: 700; font-size: 11px; color: var(--ink); }
.new { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 6px; font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.venues { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.venue { display: grid; grid-template-columns: 11.5em minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
.vname { font-size: 13px; font-weight: 600; display: flex; align-items: baseline; gap: 7px; }
.vname i { width: 9px; height: 9px; border-radius: 2px; background: var(--vc); flex: none; }
.times { display: flex; flex-wrap: wrap; gap: 5px 6px; }
.t { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface);

.t.past { color: var(--muted); font-weight: 400; text-decoration: line-through; background: transparent; }
a.t { color: inherit; text-decoration: none; }
a.t:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.empty { padding: 40px 0; color: var(--muted); }
footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; max-width: 70ch; }

.vpanel { display: contents; }
.vtoggle b { font-weight: 600; color: var(--accent); }
.vtoggle svg { width: 10px; height: 10px; transition: transform .15s; }

.vall button { border: 0; background: none; padding: 4px 6px; font-size: 13px; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 640px) {

  .vtoggle { display: inline-flex; }
  .vpanel { display: none; }
  .bar.open .vpanel { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; order: 4;

  .bar.open .vall { display: flex; flex: 1 1 100%; justify-content: flex-end; order: -1; margin-bottom: -4px; }
  #q { order: 3; flex-basis: 100%; }
  .sort { margin-left: auto; }
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// "Now" in Mexico City, whatever the viewer's own time zone is.
const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Mexico_City',
  year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
  .formatToParts(new Date()).map(p => [p.type, p.value]));
const TODAY = `${parts.year}-${parts.month}-${parts.day}`, NOW = `${parts.hour}:${parts.minute}`;

const venueIx = Object.fromEntries(DATA.venues.map((v, i) => [v.id, i]));
const allDates = [...new Set(DATA.films.flatMap(f => Object.keys(f.shows)))].sort();
const dates = allDates.filter(d => d >= TODAY).length ? allDates.filter(d => d >= TODAY) : allDates;
const state = { date: dates[0], off: new Set(), q: '', sort: 'az' };

const dateObj = d => new Date(d + 'T12:00:00');
const fmt = (d, o) => dateObj(d).toLocaleDateString('en-US', o);

function header() {
  const gen = new Date(DATA.generated);
  $('lede').textContent = `Showtimes for ${DATA.zones.join(', ')}, plus the Cineteca and independent cinemas. Updated ` +
    gen.toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Mexico_City' }) + ' (Mexico City time).';
  $('sources').innerHTML = DATA.sources.map(s =>
    `<li class="${esc(s.state)}"><span class="dot"></span><b>${esc(s.name)}</b><span class="note">${esc(s.note)}</span>` +
    (s.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(' · ') +
    '</li>').join('');
  // One-line summary; the full list folds open (open from the start on wide screens).
  const label = { ok: 'updated', partial: 'partly updated', error: 'not read', pending: 'no listings' };
  const n = st => DATA.sources.filter(s => s.state === st).length;
  $('srcsum').innerHTML = '<b>Sources</b>' + ['ok', 'partial', 'error', 'pending'].filter(n)
    .map(st => `<span class="${st}"><span class="dot"></span>${n(st)} ${label[st]}</span>`).join('');
  if (matchMedia('(min-width: 641px)').matches) $('srcs').open = true;
  $('foot').textContent = 'Times come straight from each cinema’s own site and can change; check the cinema before you go. ' +
    'Cinemas usually publish a full week on Thursday, so later days fill in after that.';
}

function showsOn(f, date) {
  const by = f.shows[date] || {};
  return Object.entries(by).filter(([v]) => !state.off.has(v)).sort((a, b) => venueIx[a[0]] - venueIx[b[0]]);
}

// A showtime links to where tickets are sold: that screening's own page when
// the cinema has one, else the film's ticket page. Past times are not links.
function timeChip(f, v, t) {
  if (state.date === TODAY && t < NOW) return `<span class="t past">${esc(t)}</span>`;
  const url = ((f.buy || {})[state.date] || {})[v]?.[t] || f.buy_url;
  return url ? `<a class="t" href="${esc(url)}" target="_blank" rel="noopener" title="Buy tickets">${esc(t)}</a>`
    : `<span class="t">${esc(t)}</span>`;
}

function render() {
  $('days').innerHTML = dates.map(d => {
    const n = DATA.films.filter(f => f.shows[d]).length;
    return `<button class="day" type="button" data-d="${d}" aria-pressed="${d === state.date}">
      <small>${d === TODAY ? 'Today' : fmt(d, { weekday: 'short' })}</small><strong>${dateObj(d).getDate()}</strong><em>${n} films</em></button>`;
  }).join('');
  $('venues').innerHTML = DATA.venues.map((v, i) =>
    `<button class="chip" type="button" data-v="${esc(v.id)}" style="--vc:var(--v${i % 6})" aria-pressed="${!state.off.has(v.id)}"><i></i>${esc(v.name)}</button>`).join('');
  const on = DATA.venues.length - state.off.size;
  $('vcount').textContent = state.off.size ? `${on} of ${DATA.venues.length}` : 'All';

  const q = state.q.trim().toLowerCase();
  let rows = DATA.films.map(f => ({ f, shows: showsOn(f, state.date) }))
    .filter(r => r.shows.length && (!q || r.f.title.toLowerCase().includes(q)));
  const first = r => {
    const ts = r.shows.flatMap(s => s[1]);
    const up = state.date === TODAY ? ts.filter(t => t >= NOW) : ts;
    return (up.length ? up : ['99:99']).sort()[0];
  };
  if (state.sort === 'time') rows.sort((a, b) => first(a).localeCompare(first(b)) || a.f.title.localeCompare(b.f.title));

  const nTimes = rows.reduce((n, r) => n + r.shows.reduce((m, s) => m + s[1].length, 0), 0);
  $('count').textContent = rows.length
    ? `${fmt(state.date, { weekday: 'long', month: 'long', day: 'numeric' })}: ${rows.length} films, ${nTimes} showtimes` : '';
  $('films').innerHTML = rows.length ? rows.map(({ f, shows }) => `
    <article class="film">
      <div>
        <h2>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>` : esc(f.title)}</h2>
        <div class="meta">${f.new ? '<span class="new">New</span>' : ''}${f.rating ? `<span class="rating">${esc(f.rating)}</span>` : ''}${f.section ? `<span>${esc(f.section)}</span>` : ''}</div>
      </div>
      <div class="venues">${shows.map(([v, ts]) => `
        <div class="venue"><span class="vname" style="--vc:var(--v${venueIx[v] % 6})"><i></i>${esc(DATA.venues[venueIx[v]].name)}</span>
        <span class="times">${ts.map(t => timeChip(f, v, t)).join('')}</span></div>`).join('')}
      </div>
    </article>`).join('')
    : '<p class="empty">Nothing matches for this day. Try another day, clear the search, or turn a cinema back on.</p>';
  $('sort-az').setAttribute('aria-pressed', state.sort === 'az');
  $('sort-time').setAttribute('aria-pressed', state.sort === 'time');
}

$('days').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) { state.date = b.dataset.d; render(); } });
$('venues').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return;
  state.off.has(b.dataset.v) ? state.off.delete(b.dataset.v) : state.off.add(b.dataset.v); render(); });
$('vtoggle').addEventListener('click', () => {
  const open = $('vtoggle').getAttribute('aria-expanded') !== 'true';
  $('vtoggle').setAttribute('aria-expanded', open);
  document.querySelector('.bar').classList.toggle('open', open);
});
document.querySelector('.vall').addEventListener('click', e => { const b = e.target.closest('[data-all]'); if (!b) return;
  state.off = b.dataset.all === '1' ? new Set() : new Set(DATA.venues.map(v => v.id)); render(); });
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sort-az').addEventListener('click', () => { state.sort = 'az'; render(); });
$('sort-time').addEventListener('click', () => { state.sort = 'time'; render(); });

header();
if (dates.length) render();
else $('films').innerHTML = '<p class="empty">No showtimes were collected on this run.</p>';
</script>
